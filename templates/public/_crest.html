{% if t.logo %}<img class="crest" src="{{ t.logo }}" alt="" style="width:{{ size }}px;height:{{ size }}px">{% elif t %}<span class="crest" style="width:{{ size }}px;height:{{ size }}px;background:hsl({{ t.hue }},55%,38%)" aria-hidden="true">{{ t.initials }}</span>{% else %}<span class="crest" style="width:{{ size }}px;height:{{ size }}px;background:#2d418c" aria-hidden="true">?</span>{% endif %}
