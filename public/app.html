<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Competition Manager</title>
<meta name="description" content="Create and run leagues and tournaments: teams, fixtures, results, standings and your staff, in one place.">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{--bg:#050d1f;--bg2:#0a1a3a;--card:#0e1f45;--card2:#0a1735;--line:#1f3566;--line2:#2c4a85;--gold:#5b9cff;--btn:#2563eb;--btn2:#1d4ed8;--tx:#f5f8ff;--tx2:#d5e0f7;--soft:#9fb2d6;--ok:#5fe39a;--bad:#ff4d6d}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 400px at 85% -10%,rgba(37,99,235,.20),transparent 60%),linear-gradient(#050d1f,#0a1a3a) fixed;background-color:#050d1f;color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;line-height:1.45}
a{color:var(--gold)}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:rgba(5,13,31,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;color:var(--tx);text-decoration:none;font-weight:900;letter-spacing:.5px}.brand .ic{color:var(--gold);width:24px;height:24px}
.top nav{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;font-size:14px}
.top nav a{color:var(--soft);text-decoration:none;font-weight:700}.top nav a:hover{color:var(--tx)}.who{color:var(--soft);font-size:13px}
.w{max-width:1040px;margin:0 auto;padding:18px 16px 70px}
h1{font-size:26px;margin:6px 0 4px}h2{font-size:18px;margin:0 0 10px}
.sub{color:var(--soft);margin:0 0 16px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px}
.gh{display:flex;align-items:center;gap:10px;color:var(--gold);font-weight:800;font-size:12px;letter-spacing:1.3px;text-transform:uppercase;margin:0 0 14px;padding-bottom:12px;border-bottom:1px solid var(--line)}.gh:before{content:"";width:6px;height:6px;border-radius:2px;background:var(--gold);box-shadow:0 0 0 4px rgba(59,130,246,.15)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border:0;border-radius:12px;background:var(--btn);color:var(--ink);font-weight:800;font-size:15px;cursor:pointer;text-decoration:none;font-family:inherit}
.btn.g{background:var(--card2);color:var(--soft);border:1px solid var(--line)}.btn.bad{background:#9b1c35;color:#fff}.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.55;cursor:default}.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
label{display:block;color:var(--soft);font-size:12px;font-weight:700;margin:10px 0 0}
input,select,textarea{width:100%;margin-top:4px;padding:11px;border:1px solid var(--line);border-radius:9px;background:var(--card2);color:var(--tx);font:inherit;font-size:15px}
textarea{resize:vertical;min-height:80px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.row{grid-template-columns:1fr}}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.note{color:var(--soft);font-size:13px}
.err{background:#4a1427;border:1px solid var(--bad);color:#ffd5dc;border-radius:10px;padding:10px;font-size:14px;margin-top:12px}
.okm{background:#123d2a;border:1px solid var(--ok);color:#d4ffe4;border-radius:10px;padding:10px;font-size:14px;margin-top:12px;word-break:break-word}
.pill{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.4px;padding:3px 8px;border-radius:20px;background:#1f3566;color:var(--tx);white-space:nowrap;vertical-align:middle}
.pill.owner{background:var(--btn);color:var(--ink)}.pill.organizer{background:#ff9f43;color:#2a1600}.pill.admin{background:#4aa3ff;color:#04203f}.pill.editor{background:#6dff9c;color:#06301a}.pill.moderator{background:#c18cff;color:#0a1735}.pill.viewer{background:#1f3566}
.pill.pending{background:#6b4a05;color:#ffe9b0}.pill.accepted{background:#1d5c3c;color:#d4ffe4}.pill.expired{background:#3a3f5c;color:#c8d0e1}.pill.revoked{background:#5a1a2d;color:#ffd5dc}.pill.soon{background:transparent;border:1px solid var(--line);color:var(--soft);font-size:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.oc{display:block;background:var(--card);border-radius:14px;padding:16px;text-decoration:none;color:var(--tx);border:1px solid transparent;transition:border-color .2s,transform .15s}.oc:hover{border-color:var(--gold);transform:translateY(-2px)}
.oc b{display:block;font-size:17px;margin-bottom:6px}.oc small{color:var(--soft)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:14px;padding:14px}.stat b{display:block;font-size:28px;color:var(--gold)}.stat span{color:var(--soft);font-size:13px}
.layout{display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:start}.layout>*{min-width:0}
.side{position:sticky;top:70px;background:var(--card);border-radius:14px;padding:8px}
.side>a,.side>span{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:9px 10px;border-radius:9px;color:var(--soft);text-decoration:none;font-weight:700;font-size:14px}
.side>a.on{background:var(--btn);color:var(--ink)}.side>a:hover:not(.on){background:var(--card2);color:var(--tx)}.side>span{opacity:.55;cursor:default}
@media(max-width:760px){.side>span{display:none}.who{display:none}.brand span{font-size:15px}.layout{grid-template-columns:1fr}.side{position:static;display:flex;overflow-x:auto;gap:4px;padding:6px}.side>a,.side>span{white-space:nowrap;flex:none}}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th{color:var(--soft);font-size:12px;font-weight:700;text-align:left}th,td{padding:9px 6px;vertical-align:middle}tr+tr td{border-top:1px solid var(--line)}
td select{margin:0;padding:7px;font-size:13px;min-width:120px}
.who-cell b{display:block}.who-cell small{color:var(--soft)}
.feed div{padding:7px 0;border-top:1px solid var(--line);font-size:13px;color:var(--soft)}.feed div:first-child{border-top:0}.feed b{color:var(--tx)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.chip{border:1px solid var(--line);background:var(--card2);color:var(--soft);border-radius:20px;padding:6px 12px;font-weight:700;font-size:13px;cursor:pointer}.chip.on{background:var(--btn);color:var(--ink);border-color:var(--gold)}
.link{display:grid;grid-template-columns:1fr auto auto;gap:6px;margin-top:8px}.link input{margin:0;font-size:13px}
details summary{cursor:pointer;color:var(--gold);font-weight:800;padding:4px 0}
.mx td,.mx th{text-align:center;font-size:12px}.mx td:first-child,.mx th:first-child{text-align:left}.mx .y{color:var(--ok);font-weight:900}.mx .n{color:#4b5a91}
.ic{width:1.1em;height:1.1em;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.auth{max-width:440px;margin:24px auto}.tabs2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}.tabs2 a{text-align:center;padding:10px;border-radius:10px;background:var(--card2);color:var(--soft);text-decoration:none;font-weight:800}.tabs2 a.on{background:var(--btn);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;max-width:min(92vw,520px);background:#123d2a;border:1px solid var(--ok);color:#d4ffe4;border-radius:12px;padding:12px 16px;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.5)}.toast.bad{background:#4a1427;border-color:var(--bad);color:#ffd5dc}.toast[hidden]{display:none}
.empty{text-align:center;padding:30px 16px}.empty>.ic{width:44px;height:44px;color:var(--gold)}
.pill.draft{background:#3a3f5c}.pill.active,.pill.finished{background:#1d5c3c;color:#d4ffe4}.pill.completed,.pill.scheduled{background:#1f3566}.pill.live{background:#ff4d6d;color:#fff}.pill.postponed{background:#6b4a05;color:#ffe9b0}.pill.cancelled{background:#5a1a2d;color:#ffd5dc}
.crest{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;object-fit:cover;flex:none;color:#fff;font-size:10px;font-weight:900;border:2px solid rgba(255,255,255,.85);background:#1f3566;overflow:hidden}img.crest{background:#fff}
.md{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:1px;margin:16px 0 4px;text-transform:uppercase}
.mrow{display:grid;grid-template-columns:150px 1fr auto 1fr;gap:10px;align-items:center;padding:10px 8px;border-radius:10px;color:var(--tx);text-decoration:none;border-top:1px solid var(--line)}.mrow:hover{background:var(--card2)}
.mrow .mt{display:flex;flex-direction:column;font-size:11px;color:var(--soft)}.mh{display:flex;align-items:center;gap:6px;justify-content:flex-end;font-weight:700;text-align:right;min-width:0}.ma{display:flex;align-items:center;gap:6px;font-weight:700;min-width:0}.mh span,.ma span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms{text-align:center;min-width:70px;display:flex;flex-direction:column;align-items:center;gap:2px}.sc{font-size:17px}.ko{color:var(--soft);font-size:13px}
@media(max-width:620px){.mrow{grid-template-columns:1fr auto 1fr}.mrow .mt{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;gap:8px}}
table.st td,table.st th{text-align:center;padding:8px 4px}.st .tl{text-align:left}.st .tm{display:flex;align-items:center;gap:6px;font-weight:700}.st .pts{font-weight:900;color:var(--gold)}.st tr.q td:first-child{box-shadow:inset 3px 0 var(--gold)}
.fm{display:inline-block;width:18px;height:18px;border-radius:4px;font-size:10px;font-weight:900;line-height:18px;margin:0 1px;text-align:center}.fm.W{background:#1d8a4f}.fm.D{background:#6b6f8c}.fm.L{background:#b03a52}
@media(max-width:620px){.hide-s{display:none}}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.subtabs a{text-decoration:none}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}.board .t{display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:800;font-size:16px}.board .big{font-size:42px;font-weight:900;white-space:nowrap}
.ev{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}.ev.away{flex-direction:row-reverse;text-align:right}.ev i{font-style:normal;color:var(--gold);font-weight:800;min-width:30px}
.picks{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.picks label{display:flex;align-items:center;gap:6px;margin:0;background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:7px 10px;color:var(--tx);font-size:13px;font-weight:600;cursor:pointer}.picks input{width:auto;margin:0;accent-color:var(--gold)}
.inline input,.inline select{margin:0;padding:7px;font-size:13px}td.inline{min-width:70px}
.ch{display:flex;align-items:center;gap:10px}.big-crest{width:56px;height:56px}
.search{max-width:320px}
/* ---------- dashboard sidebar extras & share box ---------- */
.agh-static{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--soft);padding:12px 10px 4px}
.asb-who{padding:0 10px 10px;font-weight:700;font-size:14px;border-bottom:1px solid var(--line);margin-bottom:6px}
.agi a .ic{margin-right:4px}.agi .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-right:8px;vertical-align:1px}
.agi .sub{margin:2px 0 8px 14px;padding-left:8px;border-left:1px solid var(--line)}.agi .sub a{font-size:13px;padding:6px 10px}
.orghead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 16px}.orghead h1{margin:0}
.sharebox{background:linear-gradient(135deg,rgba(59,130,246,.10),rgba(4,245,255,.06));border:1px solid rgba(59,130,246,.45);border-radius:16px;padding:16px 18px;margin:14px 0}
.sharebox.warn{background:rgba(255,176,32,.08);border-color:rgba(255,176,32,.45)}
.sbx-h{display:flex;align-items:center;gap:8px;font-weight:900;font-size:16px;color:var(--tx)}.sbx-h .ic{color:var(--gold);width:20px;height:20px}
.sharebox .link input{font-size:15px;font-weight:700;color:var(--gold);background:rgba(0,0,0,.25)}
/* ---------- super admin panel ---------- */
.w.wide{max-width:none;padding:0}
.ashell{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:calc(100vh - 58px)}
.asb{position:sticky;top:58px;height:calc(100vh - 58px);overflow-y:auto;background:#0a1a3a;border-right:1px solid var(--line);padding:14px 10px 30px;scrollbar-width:thin}
.asb-h{display:flex;align-items:center;gap:8px;font-weight:900;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);padding:6px 10px 14px}
.ag{margin-bottom:2px}.agh{width:100%;display:flex;align-items:center;justify-content:space-between;background:none;border:0;color:var(--tx);font:inherit;font-weight:800;font-size:13px;padding:9px 10px;border-radius:9px;cursor:pointer;text-align:left}
.agh:hover{background:var(--card2)}.agh .chev{transition:transform .2s;color:var(--soft)}.ag.open .agh .chev{transform:rotate(90deg)}
.agi{display:none;padding:2px 0 6px 10px}.ag.open .agi{display:block}
.agi a{display:block;padding:7px 10px;border-radius:8px;color:var(--soft);text-decoration:none;font-size:13px;font-weight:600;border-left:2px solid transparent}
.agi a:hover{color:var(--tx);background:rgba(255,255,255,.04)}.agi a.on{color:var(--gold);background:rgba(59,130,246,.08);border-left-color:var(--gold)}
.asb-f{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}.asb-f a{display:block;padding:7px 10px;color:var(--soft);text-decoration:none;font-size:13px;font-weight:600}.asb-f a:hover{color:var(--tx)}
.amain{min-width:0;padding:18px 26px 60px}
.abar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.crumbs{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--soft);flex-wrap:wrap}.crumbs a{color:var(--soft);text-decoration:none}.crumbs a:hover{color:var(--tx)}.crumbs span{opacity:.5}
.ags{margin-left:auto;display:flex;gap:6px;min-width:260px}.ags input{margin:0;padding:9px 12px;font-size:14px}
.amenu{display:none}
.ahead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 18px}.ahead h1{margin:0;font-size:26px}.ahead .actions{margin:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:18px}
.kpi{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-decoration:none;color:var(--tx);transition:border-color .15s,transform .15s}
a.kpi:hover{border-color:var(--gold);transform:translateY(-2px)}.kpi span{display:block;color:var(--soft);font-size:12px;font-weight:700;letter-spacing:.3px}.kpi b{display:block;font-size:28px;font-weight:900;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi.warn b{color:#ffb020}.kpi.bad b{color:var(--bad)}
.agrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}.toolbar label{margin:0;min-width:150px}.toolbar input,.toolbar select{margin-top:4px;padding:9px 10px;font-size:14px}
.toolbar .grow{flex:1;min-width:220px}
.dt{width:100%;border-collapse:collapse;font-size:14px}.dt th{text-align:left;color:var(--soft);font-size:11px;letter-spacing:.6px;text-transform:uppercase;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.dt td{padding:10px 8px;border-top:1px solid var(--line);vertical-align:middle}.dt tr:hover td{background:rgba(255,255,255,.025)}.dt td.num,.dt th.num{text-align:right;font-variant-numeric:tabular-nums}
.dt a{color:var(--tx);font-weight:700;text-decoration:none}.dt a:hover{color:var(--gold)}.dt small{display:block;color:var(--soft);font-weight:500}
.dt input[type=checkbox]{width:16px;height:16px;margin:0;accent-color:var(--gold)}
.pager{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-top:12px;font-size:13px;color:var(--soft)}
.bulk{display:flex;gap:8px;align-items:center;margin-left:auto}.bulk select{margin:0;padding:8px;font-size:13px;width:auto}
.sb{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap;letter-spacing:.2px}
.sb.green{background:rgba(95,227,154,.15);color:#a8f0c8}.sb.red{background:rgba(255,77,109,.16);color:#ffb3bf}.sb.amber{background:rgba(255,176,32,.16);color:#ffd27a}.sb.blue{background:rgba(4,245,255,.14);color:#8ff9ff}.sb.grey{background:rgba(140,170,255,.14);color:var(--soft)}
.chart{margin:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.chart figcaption{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}.chart figcaption b{font-size:14px}.chart figcaption span{color:var(--soft);font-size:13px}.chart figcaption strong{font-size:22px;color:var(--tx)}
.chart svg{width:100%;height:auto;display:block}.chart .bar{fill:#3b82f6}.chart .hit:hover+.bar,.chart g:hover .bar{fill:#5b9cff}.chart .ax{fill:var(--soft);font-size:10px}.chart .gl{stroke:rgba(140,170,255,.14);stroke-width:1}
.chart details{margin-top:6px;font-size:13px}.chart details table{font-size:12px}.chart details td,.chart details th{padding:3px 6px;text-align:left}
#ctip{position:fixed;z-index:50;pointer-events:none;background:#0a1735;border:1px solid var(--line2,#3a4c94);color:var(--tx);font-size:12px;padding:6px 9px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.5);display:none;font-variant-numeric:tabular-nums}
.ranges{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.kv{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:8px 14px;font-size:14px}.kv dt{color:var(--soft)}.kv dd{margin:0;word-break:break-word}
.modal{position:fixed;inset:0;z-index:40;background:rgba(3,6,20,.72);display:grid;place-items:center;padding:16px}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:440px;width:100%;box-shadow:0 30px 60px -20px rgba(0,0,0,.8)}.mbox h2{margin:0 0 8px}.mbox p{color:var(--tx2,#d5e0f7);margin:0 0 6px}
.btn.bad{background:#b03a52;color:#fff}
.oldnew{font-size:12px;color:var(--soft);word-break:break-word}.oldnew del{color:#ffb3bf;text-decoration:none}.oldnew ins{color:#a8f0c8;text-decoration:none}
.adm-link{color:var(--gold)!important}
.ctab{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
@media(max-width:900px){.ashell{grid-template-columns:1fr}.asb{position:fixed;left:0;top:0;bottom:0;height:100vh;width:min(86vw,300px);z-index:45;transform:translateX(-105%);transition:transform .2s;box-shadow:20px 0 40px rgba(0,0,0,.5)}
  .asb.show{transform:none}.amenu{display:inline-flex}.amain{padding:14px 16px 60px}.ags{min-width:0;width:100%;margin-left:0}.ahead h1{font-size:22px}
  .ascrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:44}}
/* ---------- organization portal ---------- */
.pill.team_manager{background:#0e7490;color:#fff}.pill.coach{background:#155e75;color:#e0f7ff}.pill.scorekeeper{background:#6d28d9;color:#fff}.pill.player{background:#334155;color:#e2e8f0}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:4px 0 18px}.ph h1{margin:0;font-size:28px;letter-spacing:-.4px}.ph p{margin:4px 0 0;color:var(--soft);max-width:660px}
.ptools[hidden]{display:none}.ptools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.ptools input,.ptools select{margin:0;width:auto;padding:9px 12px;font-size:14px}.ptools .grow{flex:1;min-width:200px}@media(max-width:560px){.ptools select{flex:1}}
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}

// Any photo works: big images are scaled down in the browser (to at most 512 px) before they're uploaded.
function shrinkImage(file,cb){if(!/^image\/(png|jpeg|gif|webp)$/.test(file.type)){toast("Use a PNG, JPG, GIF or WebP image",true);return}
  var LIMIT=250*1024,rd=new FileReader();rd.onerror=function(){toast("Couldn't read that image",true)};
  rd.onload=function(){var src=rd.result;if(file.size<=LIMIT)return cb(src);
    var img=new Image();img.onerror=function(){toast("That image file is damaged",true)};
    img.onload=function(){var out=null;[512,384,256].some(function(max){var k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");
        c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        return[.9,.8,.65].some(function(q){var d=c.toDataURL("image/webp",q);if(d.indexOf("data:image/webp")!==0)d=c.toDataURL("image/png");out=d;return d.length*.75<=LIMIT})});
      if(out&&out.length*.75<=LIMIT)cb(out);else toast("That image is too large even after shrinking. Try a simpler logo.",true)};
    img.src=src};
  rd.readAsDataURL(file)}

        return'<td class="'+(on!==dflt?"chg":"")+'"><input type="checkbox" data-p="'+p.key+'" data-r="'+x.key+'"'+(on?" checked":"")+(dis?" disabled":"")+' aria-label="'+esc(x.label)+': '+esc(p.label)+'"></td>'}).join("")+'</tr>'}).join("")+'</tbody></table></div>'+
    (ed?'<p class="note">Highlighted boxes differ from the defaults.</p><div class="actions"><button class="btn" id="psave">Save permissions</button><button type="button" class="btn g" id="preset">Reset to defaults</button></div>':'')+'</div>'+

  if(pid){history.replaceState(null,"",location.pathname);api(api0("/sms/purchases/"+pid+"/check"),"POST",{}).then(function(r){if(r.ok&&r.data.added)toast("Payment received: "+r.data.purchase.credits+" credits added");go2()})}else go2()}

      '<form class="card" id="scf" novalidate><div class="gh">Add or remove credits</div><div class="row"><label for="sco">Organization<select id="sco">'+d.orgs.map(function(o){return'<option value="'+o.id+'">'+esc(o.name)+'</option>'}).join("")+'</select></label><label for="scn">Credits (negative to remove)<input id="scn" type="number" step="50" value="100"></label></div><label for="scnote">Note (optional)<input id="scnote" maxlength="200" placeholder="Paid in cash on 6 Oct"></label><div class="actions"><button class="btn">Save</button></div></form>'+

      '<div class="card"><div class="gh">Blocked messages</div>'+(d.blocked.length?'<div class="tbl"><table class="dt"><thead><tr><th>When</th><th>Organization</th><th>Message</th><th>Why</th></tr></thead><tbody>'+d.blocked.map(function(m){return'<tr><td>'+dt(m.created)+'<small>'+esc(m.sender||"")+'</small></td><td>'+esc(m.org.name)+'</td><td style="max-width:380px">'+esc(m.body)+'</td><td><small>It '+esc(m.reasons.join("; it "))+'</small></td></tr>'}).join("")+'</tbody></table></div>':'<p class="note">None. Messages that look like scams, ask for PINs or codes, threaten people or link to other sites are stopped here.</p>')+'</div>'+
      '<div class="card"><div class="gh">Past credit purchases</div>'+(d.recent.length?'<div class="tbl"><table class="dt"><tbody>'+d.recent.map(function(p){return reqRow(p,false)}).join("")+'</tbody></table></div>':'<p class="note">None yet.</p>')+'</div>';

    document.querySelectorAll("[data-srj]").forEach(function(b){b.onclick=function(){confirmBox("Reject this request?","No credits are added.",{ok:"Reject",danger:true}).then(function(ok){if(ok)api("/api/admin/sms/purchases/"+b.dataset.srj+"/reject","POST",{note:"Rejected by the platform"}).then(function(r){toast(r.ok?"Rejected":r.data.error,!r.ok);aSms()})})}});

function aPro(){var sec=A("Pro League",[["Pro League"]]);
  api("/api/admin/proleague").then(function(r){if(!r.ok){sec.innerHTML=errBox(r);return}var d=r.data,S=d.settings,cur=d.seasons[0]||null;

function chart(s,labels,unit){var W=560,H=180,L=34,B=22,T=10,max=Math.max(1,Math.max.apply(null,s.values)),nb=s.values.length,bw=(W-L-4)/nb,gap=Math.min(2,bw*.25),w=Math.max(1,bw-gap),r=Math.min(4,w/2);

    var path=h<=0?"":'M'+x+','+base+'V'+(top+rr)+'Q'+x+','+top+' '+(x+rr)+','+top+'H'+(x+w-rr)+'Q'+(x+w)+','+top+' '+(x+w)+','+(top+rr)+'V'+base+'Z';
    return'<g><rect class="hit" x="'+x+'" y="'+T+'" width="'+bw+'" height="'+(H-B-T)+'" fill="transparent" data-tip="'+esc((unit==="day"?"":unit==="week"?"Week of ":"")+fmt(labels[i])+": "+v.toLocaleString())+'"></rect>'+(path?'<path class="bar" d="'+path+'"></path>':'')+'</g>'}).join("");

  var xl=[0,Math.floor((nb-1)/2),nb-1].filter(function(v,i,a){return a.indexOf(v)===i&&v>=0}).map(function(i){return'<text class="ax" x="'+(L+i*bw+w/2)+'" y="'+(H-6)+'" text-anchor="middle">'+esc(fmt(labels[i]))+'</text>'}).join("");
  return'<figure class="chart"><figcaption><span><b>'+esc(s.label)+'</b><br>per '+unit+'</span><strong>'+s.total.toLocaleString()+'</strong></figcaption><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(s.label+": "+s.total+" in this period")+'">'+ticks+bars+xl+'</svg>'+

  $("lox").onclick=function(){confirmBox("Log out every user?","Everyone except you has to log in again.",{danger:true,ok:"Log everyone out"}).then(function(y){if(y)act("/api/admin/security/logout-everyone","POST",{},"Everyone has been logged out")})}},"Security",[["System"],["Security"]])}
function kv(o){return'<dl class="kv">'+Object.keys(o).map(function(k){return'<dt>'+esc(k)+'</dt><dd>'+esc(String(o[k]))+'</dd>'}).join("")+'</dl>'}

// ---------- support ----------
function aSupport(){var kind=P("kind");alist({title:{complaint:"User complaints",organizer_request:"Organizer requests"}[kind]||"Support tickets",crumbs:[["Support"]],api:"/api/admin/tickets",search:false,
  filters:[{key:"status",label:"Status",opts:{"":"All","open":"Open","in_progress":"In progress","closed":"Closed"}},{key:"kind",label:"Type",opts:{"":"All types","support":"Support","complaint":"Complaints","organizer_request":"Organizer requests"}}],
  cols:[["Request",function(t){return'<b>'+esc(t.subject)+'</b><small style="white-space:pre-wrap">'+esc(t.body)+'</small>'+(t.reply?'<div class="oldnew"><ins>Reply: '+esc(t.reply)+'</ins></div>':'')}],["From",function(t){return ULINK(t.user)+'<small>'+esc(t.email||"")+'</small>'}],
    ["Type",function(t){return esc(t.kindLabel)}],["Status",function(t){return sb(t.status)}],["Opened",function(t){return date(t.created)}]],
  row:function(t){return'<button class="btn g sm" data-tk="'+t.id+'">Reply</button>'},
  bind:function(items){document.querySelectorAll("[data-tk]").forEach(function(b){b.onclick=function(){var t=items.filter(function(x){return x.id===+b.dataset.tk})[0],d=document.createElement("div");d.className="modal";
    d.innerHTML='<form class="mbox" id="tkf"><h2>'+esc(t.subject)+'</h2><p class="note" style="white-space:pre-wrap">'+esc(t.body)+'</p><label for="tkr">Reply (emailed to them if email is set up)<textarea id="tkr" maxlength="5000">'+esc(t.reply||"")+'</textarea></label>'+
      '<label for="tks">Status<select id="tks">'+opts({open:"Open",in_progress:"In progress",closed:"Closed"},t.status)+'</select></label><div class="actions"><button class="btn">Save</button><button type="button" class="btn g" id="tkc">Cancel</button></div></form>';
    document.body.appendChild(d);$("tkc").onclick=function(){d.remove()};$("tkr").focus();
    $("tkf").onsubmit=function(e){e.preventDefault();act("/api/admin/tickets/"+t.id,"PATCH",{reply:$("tkr").value,status:$("tks").value},"Ticket updated").then(function(x){if(x){d.remove();route()}})}}})},empty:"No tickets."})}

// ---------- help & support (every user) ----------
function supportView(){document.title="Help & support · Competition Manager";
  UM('<h1>Help & support</h1><p class="sub">Questions, problems or requests for the platform team.</p><div><form class="card" id="spf" novalidate style="max-width:680px"><div class="gh">CONTACT THE PLATFORM TEAM</div>'+
    '<label for="spk">Type<select id="spk"><option value="support">Question or problem</option><option value="complaint">Complaint</option><option value="organizer_request">Organizer request (e.g. feature my competition)</option></select></label>'+
    '<label for="sps">Subject<input id="sps" maxlength="140"></label><label for="spb">Message<textarea id="spb" maxlength="5000" rows="5"></textarea></label><div class="actions"><button class="btn">Send</button></div><div id="spm"></div></form><div id="spl"></div></div>',{key:"support"});
  var load=function(){api("/api/support").then(function(r){var t=(r.data&&r.data.tickets)||[];$("spl").innerHTML='<div class="card" style="max-width:680px"><div class="gh">YOUR REQUESTS</div>'+(r.data&&r.data.supportEmail?'<p class="note">You can also email '+esc(r.data.supportEmail)+'.</p>':'')+
    (t.length?t.map(function(x){return'<div style="border-top:1px solid var(--line);padding:10px 0"><b>'+esc(x.subject)+'</b> '+sb(x.status)+'<div class="note">'+esc(x.kindLabel)+' · '+date(x.created)+'</div>'+(x.reply?'<div class="okm">'+esc(x.reply)+'</div>':'')+'</div>'}).join(""):'<p class="note">No requests yet.</p>')+'</div>'})};
  $("spf").onsubmit=function(e){e.preventDefault();api("/api/support","POST",{kind:$("spk").value,subject:$("sps").value,body:$("spb").value}).then(function(r){if(!r.ok){$("spm").innerHTML=errBox(r);return}toast("Sent. We'll get back to you.");$("sps").value=$("spb").value="";$("spm").innerHTML="";load()})};load()}

loadMe().then(route);
</script></body></html>
