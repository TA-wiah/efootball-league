nt-weight:800;margin-top:6px}.chb{margin-top:12px;background:#2a1d02;color:#ffcd46;border-radius:12px;padding:10px;font-weight:900;font-size:16px}.chb small{color:#e5dcc4;font-weight:700}.chb.off{opacity:.6;font-size:13px}

<script>

    h+='<div class="card"><div class="gh">GROUP '+g+'</div><div class="sc"><table><tr><th>Player</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr>'+
    t.map(function(x,i){return'<tr class="'+(i<S.cfg.a?"q":(i===2&&wcNames()[x.n]?"wc":""))+'"><td class="n">'+(i+1)+'. '+esc(x.n)+'</td><td>'+x.p+'</td><td>'+x.w+'</td><td>'+x.d+'</td><td>'+x.l+'</td><td>'+x.gf+'</td><td>'+x.ga+'</td><td>'+(x.gd>0?"+":"")+x.gd+'</td><td class="pt">'+x.pts+'</td></tr>'}).join("")+
    '</table></div><div class="note">Top '+S.cfg.a+' go through'+(S.cfg.a===2&&S.cfg.w?" + best thirds (green)":"")+(gDone(g)?" ✔ group complete":"")+'</div></div>'});
  if(tab==="groups"&&S.cfg.a===2&&S.cfg.w>0)h+=thirdsCard();
  if(tab==="fix")GK().forEach(function(g){h+='<div class="card"><div class="gh">GROUP '+g+'</div>';
    fx(g).forEach(function(md,i){h+='<div class="md">MATCHDAY '+(i+1)+'</div>';md.forEach(function(m,j){h+=row(S.g[g][m[0]],S.g[g][m[1]],"r."+g+i+"_"+j,S.r[g+i+"_"+j],dis)})});h+='</div>'});
  if(tab==="st"){var B=board(),lb=function(t,arr,f,u){return'<div class="card"><div class="gh">'+t+'</div>'+(arr.length?arr.slice(0,8).map(function(x,i){return'<div class="lb"><span class="r">'+(i+1)+'</span>'+av(x.n)+'<span>'+esc(x.n)+'</span><b>'+f(x)+'</b><small>'+u+'</small></div>'}).join(""):'<div class="note">No data yet</div>')+'</div>'};
    h+=lb("⚽ TOP SCORERS",B.filter(function(x){return x.g>0}).sort(function(a,b){return b.g-a.g||b.a-a.a}),function(x){return x.g},"goals");
    h+=lb("🎯 TOP ASSISTS",B.filter(function(x){return x.a>0}).sort(function(a,b){return b.a-a.a||b.g-a.g}),function(x){return x.a},"assists");
    h+=lb("🏅 BALLON D'OR RACE",B.filter(function(x){return x.b>0}).sort(function(a,b){return b.b-a.b||b.g-a.g}),function(x){return x.b},"pts");
    h+='<div class="note">Ballon d\'Or points: goal 3 · assist 2 · champion +10 · runner-up +5</div>';
    if(admin){h+='<div class="card"><div class="gh">ENTER GOALS &amp; ASSISTS</div><div class="sr"><span></span><small>GOALS</small><small>ASSISTS</small></div>';
      plist().forEach(function(p){var v=S.st[p.n]||[];h+='<div class="sr"><span>'+esc(p.n)+'</span><input data-s="'+p.g+p.i+'.0" type="number" inputmode="numeric" min="0" value="'+(v[0]==null?"":v[0])+'"><input data-s="'+p.g+p.i+'.1" type="number" inputmode="numeric" min="0" value="'+(v[1]==null?"":v[1])+'"></div>'});h+='</div>'}}
  if(tab==="aw"){var AW=awards();AW.forEach(function(x){h+='<div class="aw'+(x.n?"":" tbd")+'"><div class="e">'+x.e+'</div><div class="t">'+esc(x.t.toUpperCase())+'</div><div class="n">'+esc(x.n||"TBD")+'</div>'+(x.d?'<div class="d">'+esc(x.d)+'</div>':"")+'</div>'});
    var bd=AW.filter(function(x){return x.bd})[0];if(bd&&bd.n)h+='<button class="btn" id="rv">🏅 Reveal the Ballon d\'Or</button>';
    if(admin){var ps=plist(),opt=function(sel){return'<option value="">— Auto / none —</option>'+ps.map(function(p){return'<option'+(p.n===sel?" selected":"")+' value="'+esc(p.n)+'">'+esc(p.n)+'</option>'}).join("")};
      h+='<div class="card"><div class="gh">EDIT AWARDS</div><div class="md">BALLON D\'OR WINNER</div><select data-aw="bd">'+opt(S.aw.bd)+'</select><div class="md">CUSTOM AWARDS</div>'+
        S.aw.c.map(function(c,i){return'<div class="ar"><input data-ct="'+i+'" value="'+esc(c.t)+'" placeholder="Award title"><select data-cn="'+i+'">'+opt(c.n)+'</select><button class="x" data-cx="'+i+'">✕</button></div>'}).join("")+
        '<button class="btn g" data-ca="1">+ Add an award</button></div>'}}
  if(tab==="ko"){var K=ko();
    var two=function(id,t,x,y,tt){var k=S.k[id]||{},q='<div class="card ko"><h3>'+t+' · TWO LEGS</h3>';
      if(!x||!y)return q+'<div class="agg">Waiting for earlier rounds</div></div>';
      q+='<div class="md">LEG 1</div>'+row(x,y,"k."+id+".l1",k.l1,dis)+'<div class="md">LEG 2</div>'+row(y,x,"k."+id+".l2",k.l2,dis);
      if(tt&&tt.ax!=null){q+='<div class="agg">Aggregate: <b>'+esc(x)+' '+tt.ax+' - '+tt.ay+' '+esc(y)+'</b></div>';
        if(tt.ax===tt.ay)q+='<div class="md">PENALTIES</div>'+row(x,y,"k."+id+".p",k.p,dis);
        if(tt.w)q+='<div class="agg">✅ Through: <b>'+esc(tt.w)+'</b></div>'}return q+'</div>'};
    h+=bracket(K)+'<div class="md" style="text-align:center">MATCH DETAILS</div>';
    K.rounds.forEach(function(rd){rd.ties.forEach(function(t,i){
      if(t.y.bye){h+='<div class="card ko"><h3>'+rd.name+' '+(i+1)+'</h3><div class="agg"><b>'+esc(t.x.n||t.x.l)+'</b> has a bye ➜ goes straight through</div></div>';return}
      if(t.fin){var f=S.k.f||{};h+='<div class="card ko" style="border:2px solid var(--gold)"><h3>THE FINAL</h3>';
        if(!t.x.n||!t.y.n)h+='<div class="agg">Waiting for the finalists</div>';
        else{h+=row(t.x.n,t.y.n,"k.f.s",f.s,dis);if(done(f.s)&&f.s[0]===f.s[1])h+='<div class="md">PENALTIES</div>'+row(t.x.n,t.y.n,"k.f.p",f.p,dis)}
        h+='</div>'}
      else h+=two(t.id,rd.name+" "+(i+1),t.x.n,t.y.n,t.res)})});
    if(K.f)h+='<button class="btn" id="cel">🏆 Show the champion</button>'}
  if(admin&&tab!=="pl")h+='<button class="btn g" data-rs="s">'+(arm==="s"?"Tap again: erase ALL scores":"Reset scores")+'</button><button class="btn g" data-rs="a">'+(arm==="a"?"Tap again: reset EVERYTHING (names too)":"Reset everything to default")+'</button>';
  if(!admin)h+=login?'<div class="card lgn"><div class="gh">ADMIN LOGIN</div><input id="lu" placeholder="Username" autocomplete="username"><input id="lp" type="password" placeholder="Password" autocomplete="current-password"><button class="btn" id="go">Log in</button><div class="note">'+esc(lerr)+'</div></div>':'<div class="lg"><button id="lg">🔐 Admin login</button></div>';
  $("view").innerHTML=h}
function setPath(p,v){var a=p.split("."),o=S;for(var i=0;i<a.length-2;i++)o=o[a[i]]=o[a[i]]||{};
  var pk=a[a.length-2],ix=+a[a.length-1];if(!Array.isArray(o[pk]))o[pk]=[null,null];o[pk][ix]=v}
function clearG(g){Object.keys(S.r).forEach(function(k){if(k[0]===g)delete S.r[k]});S.k={}}
function mark(){render();check();save()}
function plist(){var a=[];GK().forEach(function(g){S.g[g].forEach(function(n,i){a.push({n:n,g:g,i:i})})});return a}
function board(){var K=ko();return plist().map(function(p){var v=S.st[p.n]||[],g=v[0]||0,a=v[1]||0;return{n:p.n,g:g,a:a,b:g*3+a*2+(K.f&&K.f.w===p.n?10:0)+(K.f&&K.f.l===p.n?5:0)}})}
function awards(){var B=board(),K=ko(),gb=B.filter(function(x){return x.g>0}).sort(function(a,b){return b.g-a.g||b.a-a.a})[0],pm=B.filter(function(x){return x.a>0}).sort(function(a,b){return b.a-a.a||b.g-a.g})[0],
  bz=B.filter(function(x){return x.b>0}).sort(function(a,b){return b.b-a.b||b.g-a.g})[0],bn=S.aw.bd||(bz&&bz.n)||"",bs=B.filter(function(x){return x.n===bn})[0];
  var r=[{e:"🏆",t:"Champion",n:K.f&&K.f.w},{e:"🥈",t:"Runner-up",n:K.f&&K.f.l},{e:"🏅",t:"Ballon d'Or",n:bn,d:bs?bs.g+" goals · "+bs.a+" assists":"",bd:1},
    {e:"🥇",t:"Golden Boot",n:gb&&gb.n,d:gb?gb.g+" goals":""},{e:"🎯",t:"Playmaker (most assists)",n:pm&&pm.n,d:pm?pm.a+" assists":""}];
  S.aw.c.forEach(function(c){r.push({e:"⭐",t:c.t||"Award",n:c.n})});return r}
function doLogin(){var u=$("lu").value,p=$("lp").value;fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user:u,password:p})})
  .then(function(r){return r.json().then(function(j){if(r.ok){admin=true;login=false;lerr="";render()}else{lerr=j.error||"Login failed";render()}})}).catch(function(){lerr="Can't reach the server";render()})}
var sv=null;
function save(){clearTimeout(sv);$("st").textContent="Saving…";sv=setTimeout(function(){fetch("/api/state",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(S)})
  .then(function(r){$("st").textContent=r.ok?"Saved ✔":r.status===401?"Session expired – log in again":"Couldn't save"}).catch(function(){$("st").textContent="Couldn't reach the server"})},500)}
function load(first){fetch("/api/state").then(function(r){return r.json()}).then(function(j){var x=JSON.stringify(j);if(x===lastS)return;lastS=x;
  if(j&&j.g&&(!admin||first)){S=j;norm();var a=document.activeElement;if(!(a&&a.tagName==="INPUT"))render();check()}}).catch(function(){})}
document.addEventListener("click",function(e){var t=e.target,d=t.dataset||{};
  if(d.t){tab=d.t;render()}
  else if(t.id==="lo"){fetch("/api/logout",{method:"POST"}).then(function(){admin=false;tab="groups";render()})}
  else if(t.id==="go")doLogin();
  else if(t.id==="rv"){var ab=awards().filter(function(x){return x.bd})[0];celebrate(ab.n,ab.d,"BALLON D'OR 🏅")}
  else if(t.id==="lg"){login=true;render()}
  else if(t.id==="cel"){var K=ko();celebrate(K.f.w,"🥈 Runner-up: "+K.f.l)}
  else if(t.id==="cl"){$("ov").classList.remove("on");stop=true}
  else if(d.rs){if(arm!==d.rs){arm=d.rs;render();setTimeout(function(){arm="";render()},4000)}
    else{if(arm==="a")S=JSON.parse(JSON.stringify(DEF));else{S.r={};S.k={}}arm="";mark()}}
  else if(d.ca){S.aw.c.push({t:"New award",n:""});render();save()}
  else if(d.cx){S.aw.c.splice(+d.cx,1);render();save()}
  else if(d.ag){var L="ABCDEFGH",ng=null,i;for(i=0;i<8;i++)if(!S.g[L[i]]){ng=L[i];break}if(!ng){$("st").textContent="Max 8 groups.";return}
    S.g[ng]=["Player 1","Player 2","Player 3","Player 4"];var o={};Object.keys(S.g).sort().forEach(function(k){o[k]=S.g[k]});S.g=o;S.k={};mark()}
  else if(d.rg){if(GK().length<=2){$("st").textContent="You need at least 2 groups.";return}delete S.g[d.rg];clearG(d.rg);mark()}
  else if(d.rm){var g=d.rm[0],i=+d.rm.slice(1);if(S.g[g].length<=2){$("st").textContent="A group needs at least 2 players.";return}delete S.st[S.g[g][i]];S.g[g].splice(i,1);clearG(g);mark()}
  else if(d.add){var v=($("add"+d.add).value||"").trim();if(!v)return;if(S.g[d.add].length>=6){$("st").textContent="Max 6 players per group.";return}S.g[d.add].push(v);clearG(d.add);mark()}});
document.addEventListener("change",function(e){var t=e.target,d=t.dataset||{};
  if(d.p){setPath(d.p,num(t.value));mark()}
  else if(d.n){var v=t.value.trim();if(v){var gi=d.n[0],ix=+d.n.slice(1),old=S.g[gi][ix];S.g[gi][ix]=v;if(old!==v&&S.st[old]){S.st[v]=S.st[old];delete S.st[old]}if(S.aw.bd===old)S.aw.bd=v;S.aw.c.forEach(function(c){if(c.n===old)c.n=v});render();save()}else render()}
  else if(d.cf){S.cfg[d.cf]=+t.value;if(S.cfg.a===3)S.cfg.w=0;S.k={};render();save()}
  else if(d.s){var m=d.s.match(/^([A-Z])(\d+)\.(\d)$/);if(m){var nm=S.g[m[1]][+m[2]],cur=S.st[nm]||[0,0];cur[+m[3]]=num(t.value)||0;S.st[nm]=cur;save()}}
  else if(d.aw==="bd"){S.aw.bd=t.value;render();save()}
  else if(d.ct!==undefined){S.aw.c[+d.ct].t=t.value;save()}
  else if(d.cn!==undefined){S.aw.c[+d.cn].n=t.value;render();save()}});
var stop=true,ps=[];
function celebrate(w,l,t){if(!t)try{sessionStorage.setItem("cs",w)}catch(e){}
  $("ct").textContent=t||"CHAMPION";$("cn").textContent=w;$("rn").textContent=l||"";$("ov").classList.add("on");
  var c=$("cv"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;stop=false;ps=[];var cols=["#ffcd46","#ffffff","#4aa3ff","#ff5d73","#6dff9c"],n=0;
  function burst(){for(var i=0;i<70;i++)ps.push({x:Math.random()*c.width,y:-10,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,s:5+Math.random()*7,r:Math.random()*6,c:cols[i%5]})}
  burst();(function f(){if(stop){x.clearRect(0,0,c.width,c.height);return}x.clearRect(0,0,c.width,c.height);if(++n%40===0)burst();
    ps=ps.filter(function(p){return p.y<c.height+20});
    ps.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});requestAnimationFrame(f)})()}
function check(){var K=ko(),seen="";try{seen=sessionStorage.getItem("cs")}catch(e){}if(K.f&&seen!==K.f.w)celebrate(K.f.w,"🥈 Runner-up: "+K.f.l)}
render();
load(true);setInterval(load,15000);
fetch("/api/me").then(function(r){return r.json()}).then(function(j){if(j.admin){admin=true;render()}}).catch(function(){});
</script></body></html>
